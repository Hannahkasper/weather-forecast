<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View the 7-day weather forecast for Calgary, Alberta.">
  <title>7-Day Weather Forecast</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-sans antialiased">
  <header class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">7-Day Weather Forecast</h1>
    <p class="text-slate-400 text-sm sm:text-base">Plan your week with the latest weather forecast.</p>
  </header>

  <main class="w-full max-w-5xl">
    <section class="bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700/60" aria-labelledby="location-heading">
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-slate-700/60 pb-6">
        <div>
          <h2 id="location-heading" class="text-2xl font-bold text-white tracking-wide">Calgary, Alberta</h2>
          <p id="status" role="status" aria-live="polite" class="text-sm font-medium text-indigo-400 mt-1">
            Loading forecast...
          </p>
        </div>

        <button id="unit-toggle" type="button" class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-md border border-indigo-500/50 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          Switch to °F
        </button>
      </div>

      <!-- 7-Day Forecast Grid -->
      <div
        id="forecast"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3"
        aria-label="Seven-day weather forecast"
      >
      </div>
    </section>
  </main>

  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>Weather data provided by <a href="https://www.weatherapi.com/" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-400">WeatherAPI.com</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
